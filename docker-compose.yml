name: nomax

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nomax-db
    environment:
      POSTGRES_USER: nomax
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: nomax
    ports:
      - "5433:5432"
    volumes:
      - nomax_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomax -d nomax"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nomax-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - nomax_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: nomax-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+asyncpg://nomax:secret@db:5432/nomax
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-nomax-local-dev-secret-change-me-please-0123456789abcdef}
      OTP_RATE_LIMIT_PER_HOUR: ${OTP_RATE_LIMIT_PER_HOUR:-0}
      MAX_BUSINESSES_PER_OWNER: ${MAX_BUSINESSES_PER_OWNER:-1}
      MAX_BUSINESS_IMAGES: ${MAX_BUSINESS_IMAGES:-6}
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-512}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-database-backups}
      BACKUP_KEEP_REMOTE: ${BACKUP_KEEP_REMOTE:-30}
      BACKUP_DAILY_ENABLED: ${BACKUP_DAILY_ENABLED:-true}
      BACKUP_DAILY_HOUR: ${BACKUP_DAILY_HOUR:-3}
      BACKUP_DAILY_MINUTE: ${BACKUP_DAILY_MINUTE:-0}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Asia/Tehran}
      # ArvanCloud S3. Empty credentials in local development fall back to
      # the nomax_uploads volume; fill them in .env to use S3 for uploads.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.ir-thr-at1.arvanstorage.ir}
      S3_REGION: ${S3_REGION:-ir-thr-at1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-nomax-public}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-nomax-private}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_PUBLIC_READ_ACL: ${S3_PUBLIC_READ_ACL:-true}
      S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-900}
      S3_HEALTHCHECK_TTL_SECONDS: ${S3_HEALTHCHECK_TTL_SECONDS:-30}
      GEOCODER_URL: ${GEOCODER_URL:-https://nominatim.openstreetmap.org}
      GEOCODER_USER_AGENT: "${GEOCODER_USER_AGENT:-NOMAX/1.0 (+https://nomax.ir)}"
      GEOCODER_TIMEOUT_SECONDS: ${GEOCODER_TIMEOUT_SECONDS:-8}
      GEOCODER_COUNTRY_CODES: ${GEOCODER_COUNTRY_CODES:-ir}
      GEOCODER_VIEWBOX: ${GEOCODER_VIEWBOX:-50.18,30.65,50.30,30.54}
      GEOCODER_BOUNDED: ${GEOCODER_BOUNDED:-true}
      CORS_ORIGINS: '["http://localhost:5175","http://localhost:8080"]'
    volumes:
      - nomax_uploads:/data/uploads
      - nomax_backups:/data/backups
    ports:
      - "8002:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/ready')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    build: ./backend
    container_name: nomax-worker
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+asyncpg://nomax:secret@db:5432/nomax
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-nomax-local-dev-secret-change-me-please-0123456789abcdef}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.ir-thr-at1.arvanstorage.ir}
      S3_REGION: ${S3_REGION:-ir-thr-at1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-nomax-public}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-nomax-private}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_PUBLIC_READ_ACL: ${S3_PUBLIC_READ_ACL:-true}
      S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-900}
      BACKUP_DIR: /data/backups
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-512}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-database-backups}
      BACKUP_KEEP_REMOTE: ${BACKUP_KEEP_REMOTE:-30}
      BACKUP_DAILY_ENABLED: ${BACKUP_DAILY_ENABLED:-true}
      BACKUP_DAILY_HOUR: ${BACKUP_DAILY_HOUR:-3}
      BACKUP_DAILY_MINUTE: ${BACKUP_DAILY_MINUTE:-0}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Asia/Tehran}
    volumes:
      - nomax_backups:/data/backups

  web:
    build: ./frontend
    container_name: nomax-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"


volumes:
  nomax_pgdata:
  nomax_redisdata:
  nomax_uploads:
  nomax_backups:
