name: nomax

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nomax-db
    environment:
      POSTGRES_USER: nomax
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: nomax
    ports:
      - "5433:5432"
    volumes:
      - nomax_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomax -d nomax"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nomax-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - nomax_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nomax_pgdata:
  nomax_redisdata:
