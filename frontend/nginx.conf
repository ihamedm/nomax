server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API accepts gallery images up to 5 MB; leave room for multipart
    # overhead. ArvanCloud in front of this container has its own body limit
    # that must be at least as large.
    client_max_body_size 16m;

    # Vite emits content-hashed bundles: cache them for a year so the
    # ArvanCloud edge can serve repeat visits without touching the origin.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The SPA shell must never be cached, otherwise a new deploy keeps serving
    # references to deleted bundles until the CDN cache is purged.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Public liveness/readiness endpoints for ArvanCloud health checks and
    # uptime monitors. Without these, "/" would serve the SPA and always
    # answer 200.
    location = /health {
        proxy_pass http://api:8001/health;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://api:8001/ready;
        proxy_set_header Host $host;
    }

    # Database backup upload/restore can be hundreds of MB, and restores are
    # long-running. Stream the body instead of buffering it to disk first.
    location /api/v1/admin/backups {
        client_max_body_size 600m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8001;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
