<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b8a5c" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("nomax-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = theme;
        } catch (_) {
          // Theme preference is optional; fall back to the light theme.
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://static.neshan.org" crossorigin />
    <meta
      name="description"
      content="نومکس؛ بازار محلی معرفی کسب‌وکارها و خدمات شهر بهبهان"
    />
    <link
      rel="preload"
      href="/fonts/vazirmatn-arabic-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/vazirmatn-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>نومکس | NOMAX</title>
    <style>
      #nxSplash{
        position:fixed;inset:0;z-index:2147483600;
        display:flex;align-items:center;justify-content:center;flex-direction:column;
        gap:0;overflow:hidden;isolation:isolate;
        background:radial-gradient(ellipse at 50% 42%,#f0fdfa 0%,#ffffff 58%,#f8fafc 100%);
        color:#0f766e;font-family:'Vazirmatn Variable','Vazirmatn',Tahoma,sans-serif;
        opacity:1;transition:opacity .42s ease,visibility .42s ease;
      }
      #nxSplash::before,#nxSplash::after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none}
      #nxSplash::before{width:min(76vw,520px);aspect-ratio:1;border:1px solid rgba(13,148,136,.08);box-shadow:0 0 0 34px rgba(13,148,136,.025),0 0 0 78px rgba(13,148,136,.018);animation:nxSplashHalo 4s ease-in-out infinite}
      #nxSplash::after{width:360px;height:360px;background:radial-gradient(circle,rgba(45,212,191,.14),transparent 68%);filter:blur(8px)}
      .nx-splash-logo{position:relative;width:100px;height:100px;display:grid;place-items:center;margin-bottom:22px;border-radius:30px;background:linear-gradient(145deg,#14b8a6,#0f766e);box-shadow:0 18px 42px rgba(13,148,136,.25),inset 0 1px 0 rgba(255,255,255,.45);animation:nxSplashFloat 2.8s ease-in-out infinite}
      .nx-splash-logo svg{width:58px;height:58px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.1))}
      .nx-splash-orbit{position:absolute;inset:-13px;border:1px solid rgba(13,148,136,.2);border-radius:36px;animation:nxSplashOrbit 8s linear infinite}
      .nx-splash-orbit::before,.nx-splash-orbit::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#f59e0b;box-shadow:0 0 0 5px rgba(245,158,11,.12)}
      .nx-splash-orbit::before{top:10px;left:14px}.nx-splash-orbit::after{right:5px;bottom:18px;width:6px;height:6px;background:#2dd4bf;box-shadow:0 0 0 5px rgba(45,212,191,.12)}
      .nx-splash-wordmark{font-size:clamp(32px,8vw,42px);font-weight:900;letter-spacing:-1.2px;line-height:1.25;color:#115e59}
      .nx-splash-tagline{margin-top:8px;font-size:13px;font-weight:500;color:#64748b}
      .nx-splash-services{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:25px;direction:rtl}
      .nx-splash-service{display:flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid rgba(13,148,136,.12);border-radius:999px;background:rgba(255,255,255,.72);color:#475569;font-size:11px;font-weight:700;box-shadow:0 4px 14px rgba(15,23,42,.035);animation:nxSplashChip 3s ease-in-out infinite}
      .nx-splash-service:nth-child(2){animation-delay:.25s}.nx-splash-service:nth-child(3){animation-delay:.5s}
      .nx-splash-service i{font-style:normal;font-size:14px}
      .nx-splash-loading{width:132px;height:3px;margin-top:29px;overflow:hidden;border-radius:99px;background:#d9f3ee}
      .nx-splash-loading span{display:block;width:42%;height:100%;border-radius:99px;background:linear-gradient(90deg,#0d9488,#2dd4bf);animation:nxSplashProgress 1.35s ease-in-out infinite}
      #nxSplash small{margin-top:11px;font:500 11px/1.7 'Vazirmatn Variable','Vazirmatn',Tahoma,sans-serif;color:#94a3b8}
      #nxSplash.nx-splash-hide{opacity:0;visibility:hidden;pointer-events:none}
      html.dark #nxSplash{background:radial-gradient(ellipse at 50% 42%,#0c2622 0%,#0b1c20 58%,#0a161a 100%)}
      html.dark #nxSplash .nx-splash-wordmark{color:#99f6e4}
      html.dark #nxSplash .nx-splash-service{background:rgba(13,38,35,.72);border-color:rgba(45,212,191,.2);color:#c7ede6}
      html.dark #nxSplash .nx-splash-loading{background:#123c35}
      @keyframes nxSplashFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
      @keyframes nxSplashOrbit{to{transform:rotate(360deg)}}
      @keyframes nxSplashHalo{0%,100%{transform:scale(.96);opacity:.65}50%{transform:scale(1.04);opacity:1}}
      @keyframes nxSplashChip{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @keyframes nxSplashProgress{0%{transform:translateX(220%)}100%{transform:translateX(-260%)}}
      @media(max-width:420px){.nx-splash-logo{width:86px;height:86px;border-radius:26px}.nx-splash-logo svg{width:51px;height:51px}.nx-splash-services{gap:6px}.nx-splash-service{padding:6px 9px;font-size:10px}}
      @media(prefers-reduced-motion:reduce){#nxSplash *,#nxSplash::before,#nxSplash::after{animation:none!important;transition:none!important}.nx-splash-loading span{width:100%}}
    </style>
  </head>
  <body>
    <div id="nxSplash" role="status" aria-label="در حال آماده‌سازی نومکس">
      <div class="nx-splash-logo" aria-hidden="true">
        <span class="nx-splash-orbit"></span>
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M32 5C20.8 5 12 13.7 12 24.4c0 14.2 16.8 29.2 19 31.1a1.5 1.5 0 0 0 2 0c2.2-1.9 19-16.9 19-31.1C52 13.7 43.2 5 32 5Z" fill="#fff"></path>
          <circle cx="32" cy="24" r="10.2" fill="#14b8a6"></circle>
          <path d="m26.8 24.2 3.6 3.7 7.1-7.5" stroke="#fff" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </div>
      <div class="nx-splash-wordmark" dir="rtl">نومکس</div>
      <div class="nx-splash-tagline" dir="rtl">خدمات مطمئن، نزدیک‌تر از همیشه</div>
      <div class="nx-splash-services" aria-hidden="true">
        <div class="nx-splash-service" dir="rtl"><i>⌕</i> جست‌وجوی خدمات</div>
        <div class="nx-splash-service" dir="rtl"><i>✦</i> متخصصان محلی</div>
        <div class="nx-splash-service" dir="rtl"><i>✓</i> انتخاب مطمئن</div>
      </div>
      <div class="nx-splash-loading" aria-hidden="true"><span></span></div>
      <small>در حال آماده‌سازی تجربه‌ای بهتر…</small>
    </div>
    <div id="root"></div>
    <script>
      // Show the splash for at least 1s, then until React has mounted into #root.
      (function () {
        var splash = document.getElementById("nxSplash");
        if (!splash) return;
        var minDelay = new Promise(function (r) { setTimeout(r, 1000); });
        var appReady = new Promise(function (r) {
          var root = document.getElementById("root");
          if (root.childElementCount > 0) return r();
          var obs = new MutationObserver(function () {
            if (root.childElementCount > 0) { obs.disconnect(); r(); }
          });
          obs.observe(root, { childList: true });
        });
        Promise.all([minDelay, appReady]).then(function () {
          splash.classList.add("nx-splash-hide");
          setTimeout(function () { splash.remove(); }, 500);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
