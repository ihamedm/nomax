[project]
name = "nomax-backend"
version = "0.1.0"
description = "NOMAX local business services platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0,<0.113.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.31",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.0",
    "pydantic[email]>=2.7.1",
    "pyjwt>=2.8.0",
    "passlib[argon2]>=1.7.4",
    "redis>=5.0.1",
    "httpx>=0.27.0",
    "email-validator>=2.0.0",
    "greenlet>=3.0",
    "pillow>=10.0.0",
    "segno>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.6",
    "pytest-timeout>=2.3.1",
    "aiosqlite>=0.20.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
nomax = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
