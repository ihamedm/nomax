name: nomax-prod

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nomax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nomax}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nomax} -d ${POSTGRES_DB:-nomax}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nomax}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nomax}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: '["https://${DOMAIN:?set DOMAIN}"]'
      MAX_BUSINESSES_PER_OWNER: ${MAX_BUSINESSES_PER_OWNER:-1}
      MAX_BUSINESS_IMAGES: ${MAX_BUSINESS_IMAGES:-6}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.ir-thr-at1.arvanstorage.ir}
      S3_REGION: ${S3_REGION:-ir-thr-at1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-nomax-public}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-nomax-private}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_PUBLIC_READ_ACL: ${S3_PUBLIC_READ_ACL:-true}
      S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-900}
      S3_HEALTHCHECK_TTL_SECONDS: ${S3_HEALTHCHECK_TTL_SECONDS:-30}
      BACKUP_DIR: /data/backups
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-512}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-database-backups}
      BACKUP_KEEP_REMOTE: ${BACKUP_KEEP_REMOTE:-30}
      BACKUP_DAILY_ENABLED: ${BACKUP_DAILY_ENABLED:-true}
      BACKUP_DAILY_HOUR: ${BACKUP_DAILY_HOUR:-3}
      BACKUP_DAILY_MINUTE: ${BACKUP_DAILY_MINUTE:-0}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Asia/Tehran}
      GEOCODER_URL: ${GEOCODER_URL:-https://nominatim.openstreetmap.org}
      GEOCODER_USER_AGENT: "${GEOCODER_USER_AGENT:-NOMAX/1.0 (+https://nomax.ir)}"
      GEOCODER_TIMEOUT_SECONDS: ${GEOCODER_TIMEOUT_SECONDS:-8}
      GEOCODER_COUNTRY_CODES: ${GEOCODER_COUNTRY_CODES:-ir}
      GEOCODER_VIEWBOX: ${GEOCODER_VIEWBOX:-50.18,30.65,50.30,30.54}
      GEOCODER_BOUNDED: ${GEOCODER_BOUNDED:-true}
    volumes:
      - backups:/data/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/ready')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nomax}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nomax}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.ir-thr-at1.arvanstorage.ir}
      S3_REGION: ${S3_REGION:-ir-thr-at1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-nomax-public}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-nomax-private}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_PUBLIC_READ_ACL: ${S3_PUBLIC_READ_ACL:-true}
      S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-900}
      BACKUP_DIR: /data/backups
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-512}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-database-backups}
      BACKUP_KEEP_REMOTE: ${BACKUP_KEEP_REMOTE:-30}
      BACKUP_DAILY_ENABLED: ${BACKUP_DAILY_ENABLED:-true}
      BACKUP_DAILY_HOUR: ${BACKUP_DAILY_HOUR:-3}
      BACKUP_DAILY_MINUTE: ${BACKUP_DAILY_MINUTE:-0}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Asia/Tehran}
    volumes:
      - backups:/data/backups

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  backups:
  caddy_data:
  caddy_config:
