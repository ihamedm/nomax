name: nomax-prod

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nomax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nomax}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nomax} -d ${POSTGRES_DB:-nomax}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nomax}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nomax}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: '["https://${DOMAIN:?set DOMAIN}"]'
      MAX_BUSINESSES_PER_OWNER: ${MAX_BUSINESSES_PER_OWNER:-1}
      MAX_BUSINESS_IMAGES: ${MAX_BUSINESS_IMAGES:-6}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.ir-thr-at1.arvanstorage.ir}
      S3_REGION: ${S3_REGION:-ir-thr-at1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-nomax-public}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-nomax-private}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_PUBLIC_READ_ACL: ${S3_PUBLIC_READ_ACL:-true}
      S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-900}
      S3_HEALTHCHECK_TTL_SECONDS: ${S3_HEALTHCHECK_TTL_SECONDS:-30}
      BACKUP_DIR: /data/backups
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-512}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-database-backups}
      BACKUP_KEEP_REMOTE: ${BACKUP_KEEP_REMOTE:-30}
      BACKUP_DAILY_ENABLED: ${BACKUP_DAILY_ENABLED:-true}
      BACKUP_DAILY_HOUR: ${BACKUP_DAILY_HOUR:-3}
      BACKUP_DAILY_MINUTE: ${BACKUP_DAILY_MINUTE:-0}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Asia/Tehran}
      # SMS/OTP. Production must use a real provider: with SMS_PROVIDER=console
      # the API never delivers codes and (since APP_ENV=production) never
      # returns them either, so every login would fail.
      SMS_PROVIDER: ${SMS_PROVIDER:-mellipayamak}
      SMS_API_URL: ${SMS_API_URL:-https://rest.payamak-panel.com/api/SendSMS/BaseServiceNumber}
      SMS_USERNAME: ${SMS_USERNAME:-}
      SMS_PASSWORD: ${SMS_PASSWORD:-}
      SMS_OTP_BODY_ID: ${SMS_OTP_BODY_ID:-0}
      SMS_TIMEOUT_SECONDS: ${SMS_TIMEOUT_SECONDS:-8}
      SMS_MAX_ATTEMPTS: ${SMS_MAX_ATTEMPTS:-2}
      OTP_RATE_LIMIT_PER_HOUR: ${OTP_RATE_LIMIT_PER_HOUR:-3}
      DEV_OTP_ENABLED: ${DEV_OTP_ENABLED:-false}
      GEOCODER_URL: ${GEOCODER_URL:-https://nominatim.openstreetmap.org}
      GEOCODER_USER_AGENT: "${GEOCODER_USER_AGENT:-NOMAX/1.0 (+https://nomax.ir)}"
      GEOCODER_TIMEOUT_SECONDS: ${GEOCODER_TIMEOUT_SECONDS:-8}
      GEOCODER_COUNTRY_CODES: ${GEOCODER_COUNTRY_CODES:-ir}
      GEOCODER_VIEWBOX: ${GEOCODER_VIEWBOX:-50.18,30.65,50.30,30.54}
      GEOCODER_BOUNDED: ${GEOCODER_BOUNDED:-true}
      # Optional Laya sidecar, temporarily disabled for the beta. Default off;
      # set LAYA_ENABLED=true after starting the `laya` compose profile.
      LAYA_ENABLED: ${LAYA_ENABLED:-false}
      LAYA_BASE_URL: http://laya:8000
      LAYA_API_KEY: ${LAYA_API_KEY:-}
      LAYA_MODEL: multilingual
      LAYA_RULES_ENABLED: ${LAYA_RULES_ENABLED:-true}
      LAYA_TIMEOUT_SECONDS: ${LAYA_TIMEOUT_SECONDS:-8}
      LAYA_MIN_CATEGORY_CONFIDENCE: ${LAYA_MIN_CATEGORY_CONFIDENCE:-0.55}
      LAYA_MIN_CATEGORY_MARGIN: ${LAYA_MIN_CATEGORY_MARGIN:-0.08}
      LAYA_MIN_SUBCATEGORY_CONFIDENCE: ${LAYA_MIN_SUBCATEGORY_CONFIDENCE:-0.40}
      LAYA_HIGH_CONFIDENCE: ${LAYA_HIGH_CONFIDENCE:-0.80}
      LAYA_MEDIUM_CONFIDENCE: ${LAYA_MEDIUM_CONFIDENCE:-0.55}
      LAYA_MAX_SUGGESTIONS: ${LAYA_MAX_SUGGESTIONS:-3}
    volumes:
      - backups:/data/backups
    healthcheck:
      # Liveness only: /ready also probes Redis and ArvanCloud S3, and a
      # transient S3 hiccup must not keep web/worker from starting. Use /ready
      # for monitoring and alerts instead.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nomax}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nomax}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.ir-thr-at1.arvanstorage.ir}
      S3_REGION: ${S3_REGION:-ir-thr-at1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-nomax-public}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-nomax-private}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_PUBLIC_READ_ACL: ${S3_PUBLIC_READ_ACL:-true}
      S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-900}
      BACKUP_DIR: /data/backups
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-512}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-database-backups}
      BACKUP_KEEP_REMOTE: ${BACKUP_KEEP_REMOTE:-30}
      BACKUP_DAILY_ENABLED: ${BACKUP_DAILY_ENABLED:-true}
      BACKUP_DAILY_HOUR: ${BACKUP_DAILY_HOUR:-3}
      BACKUP_DAILY_MINUTE: ${BACKUP_DAILY_MINUTE:-0}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Asia/Tehran}
    volumes:
      - backups:/data/backups

  # Optional Laya System-1 classifier, temporarily disabled for the beta.
  # Enable with LAYA_ENABLED=true and:
  #   docker compose --profile laya up -d
  laya:
    profiles: ["laya"]
    build:
      context: ./deploy/laya
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LAYA_API_KEY: ${LAYA_API_KEY:-}
      LAYA_THREADS: ${LAYA_THREADS:-2}
    volumes:
      - laya_models:/data/huggingface
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 240s

  web:
    build:
      context: ./frontend
      # Public, build-time values baked into the JS bundle. Set
      # VITE_NESHAN_MAP_KEY in .env.prod to enable the map; leaving it empty
      # degrades to the manual location picker.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        VITE_NESHAN_MAP_KEY: ${VITE_NESHAN_MAP_KEY:-}
        VITE_MAP_CENTER_LAT: ${VITE_MAP_CENTER_LAT:-30.638}
        VITE_MAP_CENTER_LNG: ${VITE_MAP_CENTER_LNG:-50.838}
        VITE_MAP_DEFAULT_ZOOM: ${VITE_MAP_DEFAULT_ZOOM:-13}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  backups:
  laya_models:
  caddy_data:
  caddy_config:
